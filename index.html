<title>HORUS Terrain</title>

<style>
/* Layout : application mobile une colonne, barre de titre collante, actions principales en bas d'écran */
:root{
  --nuit:#223558; --vert:#A0C555; --vert-f:#6E9A2A;
  --fond:#EEF1F6; --carte:#FFFFFF; --texte:#1B2333; --doux:#5F6B82; --ligne:#D6DCE7; --champ:#F6F8FB;
  --rouge:#C83333; --bleu-eau:#1B8AC9; --ombre:0 1px 2px rgba(20,30,60,.08),0 3px 12px rgba(20,30,60,.06);
  --titre:"Avenir Next","Century Gothic","Montserrat","Futura","Segoe UI",system-ui,sans-serif;
  --corps:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fond:#111826; --carte:#1A2335; --texte:#E7ECF5; --doux:#9AA6BD; --ligne:#2C3850; --champ:#212C42; --nuit:#2B4475;
  --ombre:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{--fond:#111826; --carte:#1A2335; --texte:#E7ECF5; --doux:#9AA6BD; --ligne:#2C3850; --champ:#212C42; --nuit:#2B4475;
  --ombre:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.4 var(--corps)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#223558}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#223558;color:#fff;
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;min-height:56px}
header h1{font:700 18px/1.15 var(--titre);margin:0;flex:1;min-width:0;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header h1 small{display:block;font:500 12px/1.3 var(--corps);color:#B9C6DD;letter-spacing:0}
header .marque{width:30px;height:30px;flex:0 0 30px;border-radius:7px;background:#A0C555;display:grid;place-items:center;font:800 13px var(--titre);color:#223558}
header button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;min-width:44px;height:40px;font-size:15px;padding:0 12px}
main{padding-block:14px 120px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}
.carte{background:var(--carte);border-radius:14px;box-shadow:var(--ombre);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
h2{font:700 13px/1.2 var(--titre);text-transform:uppercase;letter-spacing:1.1px;color:var(--doux);margin:4px 2px 0}
h3{font:700 15px/1.2 var(--titre);margin:0;color:var(--texte)}
.ligne{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.esp{flex:1}
.doux{color:var(--doux);font-size:13.5px}
label.ch{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--doux);min-width:0}
input,select,textarea{font:16px var(--corps);color:var(--texte);background:var(--champ);border:1px solid var(--ligne);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid #A0C555;outline-offset:0;border-color:transparent}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
button{font:600 15px var(--corps);border-radius:12px;border:1px solid var(--ligne);background:var(--carte);color:var(--texte);min-height:44px;padding:0 14px;cursor:pointer}
button:focus-visible{outline:2px solid #A0C555;outline-offset:2px}
button.prim{background:#223558;color:#fff;border-color:#223558}
button.vert{background:#A0C555;color:#223558;border-color:#A0C555}
button.dang{color:var(--rouge);border-color:transparent;background:transparent}
button.plein{width:100%}
button.mini{min-height:36px;font-size:14px;padding:0 10px;border-radius:9px}
.liste{display:flex;flex-direction:column}
.it{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--ligne);min-width:0;cursor:pointer}
.it:first-child{border-top:0}
.it .t{flex:1;min-width:0}
.it .t b{display:block;font-size:16px}
.it .t span{display:block;color:var(--doux);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .fl{color:var(--doux);font-size:20px}
.badge{font:700 12px var(--titre);letter-spacing:.4px;padding:5px 8px;border-radius:7px;color:#fff;min-width:42px;text-align:center;flex:0 0 auto}
.pill{display:inline-block;font-size:12px;padding:3px 8px;border-radius:20px;background:var(--champ);color:var(--doux);border:1px solid var(--ligne)}
.pill.ok{background:#E7F3D6;color:#43611A;border-color:#CFE5AD}
.vide{color:var(--doux);text-align:center;padding:18px 8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border-radius:20px;min-height:36px;padding:0 12px;font-weight:500;font-size:14px;background:var(--champ)}
.chip.on{background:#223558;color:#fff;border-color:#223558}
.couche{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:stretch;padding:8px 0;border-top:1px solid var(--ligne);cursor:pointer}
.couche:first-child{border-top:0}
.couche .prof{font:600 13px var(--corps);font-variant-numeric:tabular-nums;color:var(--doux);display:flex;flex-direction:column;justify-content:space-between}
.couche .desc{display:flex;gap:9px;align-items:stretch;min-width:0}
.couche .desc i{width:14px;flex:0 0 14px;border-radius:3px}
.couche .desc span{min-width:0;font-size:15px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;display:block;background:var(--champ)}
.photos figcaption{font-size:11.5px;color:var(--doux);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barre{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--carte) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--ligne);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;gap:10px;justify-content:center}
.barre>*{flex:1;max-width:360px}
.feuille{position:fixed;inset:0;z-index:20;background:rgba(17,24,38,.5);display:flex;align-items:flex-end;justify-content:center}
.feuille>div{background:var(--fond);width:100%;max-width:760px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;
  padding-top:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
.feuille .poignee{width:42px;height:5px;border-radius:3px;background:var(--ligne);align-self:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:#223558;color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--ombre);max-width:90%}
.alerte{background:#FFF4DE;color:#7A4B00;border-radius:12px;padding:10px 12px;font-size:13.5px}
.gps{font-variant-numeric:tabular-nums;font-size:14px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.rel{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--ligne);font-variant-numeric:tabular-nums}
.rel:first-child{border-top:0}
@media (max-width:380px){.g3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion: no-preference){.feuille>div{animation:monte .18s ease-out}@keyframes monte{from{transform:translateY(30px);opacity:.6}}}
.themes{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.themes .chip{flex:0 0 auto}
.carte-geo{position:relative;height:58vh;min-height:300px;overflow:hidden;border-radius:14px;background:#DDE3EC;touch-action:none;box-shadow:var(--ombre);user-select:none;-webkit-user-select:none}
.carte-geo .calque{position:absolute;inset:0}
.carte-geo .calque img{position:absolute;width:256px;height:256px;max-width:none;pointer-events:none}
.rep-s,.rep-pt{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1.5px #223558}
.rep-s{background:#A0C555}
.rep-pt{background:#E4572E;width:18px;height:18px;margin:-9px 0 0 -9px}
.rep-nom{position:absolute;font:700 12px var(--corps);color:#223558;background:rgba(255,255,255,.85);padding:1px 5px;border-radius:5px;pointer-events:none}
.cmd-carte{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:6px}
.cmd-carte button{width:44px;height:44px;padding:0;font-size:22px;border-radius:12px;background:#fff;color:#223558;border:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.leg-geol{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.leg-geol div{display:grid;grid-template-columns:18px 54px 1fr;gap:8px;align-items:start;font-size:13px}
.leg-geol i{width:18px;height:14px;border-radius:3px;margin-top:2px;border:1px solid rgba(0,0,0,.15)}
.leg-geol span{min-width:0}
.onglets{display:grid;grid-template-columns:1fr 1fr;background:var(--champ);border:1px solid var(--ligne);border-radius:12px;padding:3px;gap:3px}
.onglets button{border:0;background:transparent;min-height:40px;border-radius:9px;color:var(--doux)}
.onglets button.on{background:var(--carte);color:var(--texte);box-shadow:var(--ombre)}
.semaine{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.semaine button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;min-height:58px;border-radius:10px;background:var(--champ)}
.semaine small{font-size:11.5px;color:var(--doux);font-weight:600}
.semaine b{font-size:17px;font-variant-numeric:tabular-nums}
.semaine i{width:6px;height:6px;border-radius:50%;background:#A0C555}
.semaine button.auj b{color:#6E9A2A}
.semaine button.on{background:#223558;border-color:#223558}
.semaine button.on small,.semaine button.on b{color:#fff}
.creneau{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:start;padding:12px 2px;border-top:1px solid var(--ligne);cursor:pointer}
.creneau:first-child{border-top:0}
.creneau .heures{display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.creneau .heures b{font-size:16px}
.creneau .heures span{color:var(--doux);font-size:14px}
.creneau .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.creneau .t span{font-size:14px;overflow-wrap:anywhere}
.itin{font-size:13.5px;font-weight:600;color:#1B8AC9;text-decoration:none;padding:6px 0}
.lu{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:12px;background:var(--carte)}
.lu i{width:10px;align-self:stretch;border-radius:4px;flex:0 0 10px}
.creneau{border-left:5px solid var(--cat,#A7B0BF);padding-left:10px;border-radius:4px}
.cat-lib{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--doux);font-weight:700}
.semaine .pts{display:flex;gap:2px;height:6px}
.semaine .pts i{width:6px;height:6px;border-radius:50%}
.leg-cat{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--doux)}
.leg-cat span{display:inline-flex;align-items:center;gap:5px}
.leg-cat i,.chip.cat i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chip.cat{display:inline-flex;align-items:center;gap:6px}
.rf-dessin{display:flex;flex-direction:column;gap:8px;overflow:hidden;border:1px solid var(--ligne);border-radius:12px;background:#fff;padding:6px}
.rf-ligne{display:grid;grid-template-columns:18px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.rf-ligne b{align-self:center;color:var(--doux)}
button.itin{background:transparent;border:1px solid var(--ligne);color:#1B8AC9;min-height:36px;padding:0 10px;border-radius:9px;font-size:13.5px}
</style>

<header>
  <button id="b-retour" aria-label="Retour" hidden>‹</button>
  <div class="marque" id="marque" aria-hidden="true">H</div>
  <h1 id="titre">HORUS Terrain<small>Sondages · GINGER CEBTP</small></h1>
  <button id="b-action" hidden></button>
</header>
<main id="main"></main>
<div class="barre" id="barre" hidden></div>

<script>
"use strict";
/* ============================================================ HORUS Terrain
   Saisie des sondages sur le terrain (iPhone), hors connexion ; export par mail vers HORUS (format HORUS-terrain v1). */
const VERSION_APP = "1.7";
const TYPES = {
  SP: ["Sondage pressiométrique", "#EB9C20"], SD: ["Sondage destructif", "#2E86DE"], SC: ["Sondage carotté", "#455A64"],
  PM: ["Pelle mécanique", "#8D6E63"], T: ["Tarière", "#6D8F2A"], PD: ["Pénétromètre dynamique", "#C62828"],
  CPT: ["Pénétromètre statique", "#7B1FA2"], RF: ["Reconnaissance de fondation", "#00897B"], PZ: ["Piézomètre", "#1B8AC9"],
};
/* matériaux : id de motif HORUS, genre, famille (fin, grenu, roche, autre), couleur du motif */
const MATERIAUX = [
  ["terre_vegetale", "Terre végétale", "f", "autre", "#6B4F2A"], ["remblai", "Remblai", "m", "autre", "#9E9E9E"],
  ["argile", "Argile", "f", "fin", "#B98A5A"], ["limon", "Limon", "m", "fin", "#D8B98A"], ["sable", "Sable", "m", "grenu", "#E8D49B"],
  ["grave", "Grave", "f", "grenu", "#BFA77A"], ["marne", "Marne", "f", "fin", "#B7B79A"], ["tourbe", "Tourbe", "f", "fin", "#3E3A2E"],
  ["calcaire", "Calcaire", "m", "roche", "#D9D3C0"], ["gres", "Grès", "m", "roche", "#D2B48C"], ["flysch", "Flysch", "m", "roche", "#8E8B7E"],
  ["roche_alteree", "Roche altérée", "f", "roche", "#A39D8F"], ["enrobe", "Enrobé", "m", "autre", "#4A4A4A"], ["beton", "Béton", "m", "autre", "#E8838C"],
];
const MAT = Object.fromEntries(MATERIAUX.map(m => [m[0], { id: m[0], lib: m[1], g: m[2], fam: m[3], c: m[4] }]));
const COUL_MOTIF = { ...Object.fromEntries(MATERIAUX.map(m => [m[0], m[4]])), argile_limoneuse: "#C49A6C", argile_galets: "#A9784A", argile_graveleuse: "#7A5532", sable_graveleux: "#DCC488" };
const SECONDAIRES = [["sableux", "sableuse"], ["limoneux", "limoneuse"], ["argileux", "argileuse"], ["graveleux", "graveleuse"], ["à galets", "à galets"], ["à blocs", "à blocs"], ["à débris", "à débris"]];
const COULEURS = [["beige", "beige"], ["marron", "marron"], ["brun", "brune"], ["ocre", "ocre"], ["gris", "grise"], ["noir", "noire"], ["jaune", "jaune"], ["verdâtre", "verdâtre"], ["rougeâtre", "rougeâtre"], ["blanchâtre", "blanchâtre"], ["bariolé", "bariolée"]];
const ETATS = {
  fin: [["très mou", "très molle"], ["mou", "molle"], ["ferme", "ferme"], ["raide", "raide"], ["très raide", "très raide"], ["dur", "dure"]],
  grenu: [["lâche", "lâche"], ["moyennement dense", "moyennement dense"], ["dense", "dense"], ["très dense", "très dense"]],
  roche: [["très altéré", "très altérée"], ["altéré", "altérée"], ["fracturé", "fracturée"], ["sain", "saine"]],
  autre: [],
};
const HUMIDITES = [["sec", "sèche"], ["humide", "humide"], ["très humide", "très humide"], ["saturé", "saturée"]];

// ------------------------------------------------------------ outils
const $ = s => document.querySelector(s);
function h(tag, a, ...k) {
  const e = document.createElement(tag);
  for (const [n, v] of Object.entries(a || {})) {
    if (v == null || v === false) continue;
    if (n.startsWith("on")) e.addEventListener(n.slice(2), v);
    else if (n === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (n in e && typeof v !== "string") e[n] = v;
    else e.setAttribute(n, v === true ? "" : v);
  }
  for (const c of k.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const uid = p => p + "_" + Math.random().toString(16).slice(2, 10);
const num = v => { const x = parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return isFinite(x) ? x : null; };
const fr = (x, n = 2) => x == null || isNaN(x) ? "–" : Number(x).toFixed(n).replace(".", ",");
const aff = v => v == null ? "" : String(+(+v).toFixed(4)).replace(".", ",");
const aujourdhui = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const maintenant = () => { const d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
const dateFr = d => d ? d.split("-").reverse().join("/") : "";
function toast(t, ms = 2600) { const e = h("div", { class: "toast", role: "status" }, t); document.body.append(e); setTimeout(() => e.remove(), ms); }

// ------------------------------------------------------------ stockage (IndexedDB, repli en mémoire)
const STORE = { db: null, memoire: new Map(), ok: false };
function ouvrirBase() {
  return new Promise(ok => {
    try {
      const r = indexedDB.open("horus-terrain", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("dossiers", { keyPath: "id" });
      r.onsuccess = () => { STORE.db = r.result; STORE.ok = true; ok(); };
      r.onerror = () => ok();
    } catch (e) { ok(); }
  });
}
function lireTout() {
  return new Promise(ok => {
    if (!STORE.db) return ok([...STORE.memoire.values()]);
    try {
      const r = STORE.db.transaction("dossiers").objectStore("dossiers").getAll();
      r.onsuccess = () => ok(r.result || []); r.onerror = () => ok([...STORE.memoire.values()]);
    } catch (e) { ok([...STORE.memoire.values()]); }
  });
}
function ecrire(d) {
  d.maj = new Date().toISOString();
  STORE.memoire.set(d.id, d);
  if (!STORE.db) return Promise.resolve();
  return new Promise(ok => {
    try { const t = STORE.db.transaction("dossiers", "readwrite"); t.objectStore("dossiers").put(d); t.oncomplete = ok; t.onerror = () => { toast("Enregistrement impossible sur cet appareil."); ok(); }; }
    catch (e) { ok(); }
  });
}
function effacer(id) {
  STORE.memoire.delete(id);
  if (!STORE.db) return Promise.resolve();
  return new Promise(ok => { try { const t = STORE.db.transaction("dossiers", "readwrite"); t.objectStore("dossiers").delete(id); t.oncomplete = ok; t.onerror = ok; } catch (e) { ok(); } });
}

// ------------------------------------------------------------ état et navigation
let DOSSIERS = [], PILE = [{ v: "accueil" }];
const vue = () => PILE[PILE.length - 1];
const D = () => DOSSIERS.find(d => d.id === vue().d);
const S = () => { const d = D(); return d && d.sondages.find(s => s.id === vue().s); };
function aller(v) { PILE.push(v); rendre(); window.scrollTo(0, 0); }
function retour() { if (PILE.length > 1) PILE.pop(); rendre(); window.scrollTo(0, 0); }
let minuterie = null;
function sauver(d = D()) { if (!d) return; clearTimeout(minuterie); minuterie = setTimeout(() => ecrire(d), 300); }

function entete(titre, sous, action) {
  $("#titre").innerHTML = ""; $("#titre").append(titre, h("small", {}, sous || ""));
  $("#b-retour").hidden = PILE.length <= 1;
  $("#marque").hidden = PILE.length > 1;
  const b = $("#b-action");

      creneaux.push({ date: dateDe(j), debut: q(Math.max(H0, hDeb)), fin: q(Math.min(H1, hFin)), dossier: lib, couleur: coul, type: catCouleur(coul) });
    }
  }
  creneaux.sort((p, q) => (p.date + p.debut).localeCompare(q.date + q.debut));
  const js = jours.map(m => dateDe(m.v)).concat(creneaux.map(c => c.date)).sort();
  return { ligne: L[i].t, noms: L.map(l => l.t), du: js[0], au: js[js.length - 1], H0, H1, creneaux, moisLu: mois, anLu: an };
}
function importerPlanning() {
  const inp = h("input", { type: "file", accept: "image/*", style: { display: "none" } });
  inp.onchange = async () => {
    const f = inp.files[0]; inp.remove(); if (!f) return;
    if (!navigator.onLine) return toast("La lecture de la photo a besoin d'une connexion (téléchargement du moteur de lecture la première fois).", 5000);
    const url = URL.createObjectURL(f), img = new Image();
    await new Promise((ok, ko) => { img.onload = ok; img.onerror = ko; img.src = url; }).catch(() => null);
    const etat = h("p", { class: "doux", style: { margin: 0 } }, "Préparation…");
    const zone = h("div", { style: { display: "flex", flexDirection: "column", gap: "10px" } }, h("img", { src: url, alt: "Planning", style: { borderRadius: "10px", maxHeight: "28vh", objectFit: "contain", background: "#fff" } }), etat);
    let resultat = null, fermerF = null;
    const actions = () => resultat && resultat.creneaux ? [h("button", { class: "prim", onclick: () => ajouter() }, "Ajouter au planning")] : [];
    fermerF = feuille("Planning d'agence", zone, actions);
    const cases = [];
    let remplacer = true;
    function ajouter() {
      const choisis = resultat.creneaux.filter((c, i) => cases[i] && cases[i].checked);
      const dates = new Set(resultat.creneaux.map(c => c.date));
      if (remplacer) PLANNING.creneaux = PLANNING.creneaux.filter(c => !(c.source === "photo" && dates.has(c.date)));
      choisis.forEach(c => PLANNING.creneaux.push({ id: uid("cr"), date: c.date, debut: c.debut, fin: c.fin, type: catDe(c), dossier: c.dossier, numero: "", adresse: "", obs: "", source: "photo" }));
      sauverPlanning(); document.querySelector(".feuille") && document.querySelector(".feuille").remove();
      if (choisis.length) JOUR_TECH = choisis[0].date;
      toast(choisis.length + " créneau(x) ajouté(s). Complétez numéros et adresses en touchant chaque créneau.", 5000); rendre();
    }
    try {
      resultat = await analyserPlanning(img, PLANNING.nom, t => { etat.textContent = t; });
      if (resultat.erreur) {
        etat.textContent = resultat.erreur + " Noms lus : " + resultat.noms.join(", ") + ".";
        zone.append(h("p", { class: "doux", style: { margin: 0 } }, "Choisissez votre ligne :"), h("div", { class: "chips" }, ...resultat.noms.map(nm => h("button", { class: "chip", onclick: async () => {
          etat.textContent = "Relecture…"; const r2 = await analyserPlanning(img, nm.split(" ")[0], t => { etat.textContent = t; }); resultat = r2; afficher();
        } }, nm))));
        return;
      }
      afficher();
    } catch (e) { etat.textContent = "Lecture impossible : " + (e.message || e) + ". Une capture d'écran nette du planning (plutôt qu'une photo d'écran) donne de meilleurs résultats."; }
    function afficher() {
      zone.innerHTML = "";
      const r = resultat, dD = dIso(r.du), dA = dIso(r.au);
      zone.append(h("p", { style: { margin: 0 } }, "Ligne lue : ", h("b", {}, r.ligne), " · du " + jourLong(r.du) + " au " + jourLong(r.au) + " " + dA.getFullYear() + " (journées de " + r.H0 + " h à " + r.H1 + " h)."));
      if (!r.creneaux.length) zone.append(h("div", { class: "vide" }, "Aucun créneau trouvé sur votre ligne."));
      let jourPrec = "";
      r.creneaux.forEach((c, i) => {
        if (c.date !== jourPrec) { zone.append(h("b", { style: { marginTop: "4px" } }, jourLong(c.date))); jourPrec = c.date; }
        const cb = h("input", { type: "checkbox", checked: true, style: { width: "22px", height: "22px", flex: "0 0 22px" } }); cases[i] = cb;
        const lib = h("input", { value: c.dossier, placeholder: "libellé", oninput: () => { c.dossier = lib.value; } });
        const de = h("input", { type: "time", value: c.debut, style: { width: "auto" }, onchange: () => { c.debut = de.value; } });
        const fi = h("input", { type: "time", value: c.fin, style: { width: "auto" }, onchange: () => { c.fin = fi.value; } });
        const bande = h("i", { style: { background: CATS[catDe(c)][1] } });
        zone.append(h("div", { class: "lu" }, cb, bande, h("div", { style: { flex: 1, minWidth: 0, display: "flex", flexDirection: "column", gap: "6px" } }, lib, h("div", { class: "ligne" }, de, "→", fi), choixCat(c, () => { bande.style.background = CATS[catDe(c)][1]; }))));
      });
      const cbR = h("input", { type: "checkbox", checked: true, onchange: () => { remplacer = cbR.checked; } });
      zone.append(h("label", { class: "ligne", style: { fontSize: "14px" } }, cbR, "Remplacer les créneaux déjà importés par photo sur ces jours"),
        h("p", { class: "doux", style: { margin: 0, fontSize: "12.5px" } }, "Vérifiez les heures et les libellés : la lecture est automatique. Les libellés tronqués sur le planning le restent ici."));
      const pied = document.querySelector(".feuille [role=dialog] > .ligne:last-child");
      if (pied && !pied.querySelector(".prim")) pied.append(h("button", { class: "prim", onclick: ajouter }, "Ajouter au planning"));
    }
  };
  document.body.append(inp); inp.click();
}

// ------------------------------------------------------------ export par mail
function paquet(d) {
  return { format: "HORUS-terrain", version: 1, app: "HORUS Terrain " + VERSION_APP, exporte_le: new Date().toISOString(),
    dossier: { numero: d.numero, nom: d.nom, commune: d.commune, operateur: d.operateur, machine: d.machine },
    sondages: d.sondages.map(s => ({ ...s, lithologie: s.lithologie.map(c => ({ de: c.de, a: c.a, description: c.description, motif: c.motif })) })) };
}
function telecharger(fichier) {
  const url = URL.createObjectURL(fichier), a = h("a", { href: url, download: fichier.name, style: { display: "none" } });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}
async function exporter(d) {
  if (!d.sondages.length) return toast("Aucun sondage à envoyer.");
  const json = JSON.stringify(paquet(d));
  const taille = new Blob([json]).size;
  // .txt / text/plain : Chrome sur Android n'accepte de partager que certains types (le .json y est refusé : « Permission denied »)
  const nom = "HORUS_terrain_" + (d.numero || "dossier").replace(/[^\w.-]+/g, "_") + "_" + aujourdhui().replace(/-/g, "") + ".txt";
  const fichier = new File([json], nom, { type: "text/plain" });
  const mo = (taille / 1048576).toFixed(1).replace(".", ",");
  const fini = async fermer => { d.exporte = new Date().toISOString(); await ecrire(d); fermer(); rendre(); };
  const envoyer = async fermer => {
    try {
      if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
        await navigator.share({ files: [fichier], title: nom, text: "Saisies terrain " + (d.numero || "") + " " + (d.nom || "") + " - à importer dans HORUS (Importer…)." });
        await fini(fermer); toast("Dossier prêt à envoyer."); return;
      }
      const dl = window.claude ? await window.claude.use("downloads") : null;
      if (dl) { await dl.save({ filename: nom, data: fichier }); await fini(fermer); toast("Fichier enregistré : joignez-le à un mail."); return; }
      throw new Error("partage indisponible");
    } catch (e) {
      if (e && e.name === "AbortError") return;
      // repli : téléchargement du fichier (Téléchargements / Fichiers), à joindre au mail
      try { telecharger(fichier); await fini(fermer); toast("Partage refusé par ce téléphone : fichier enregistré dans Téléchargements (" + nom + "). Joignez-le à un mail.", 6000); }
      catch (e2) { toast("Envoi impossible ici : " + (e.message || e) + ".", 5000); }
    }
  };
  feuille("Envoyer à HORUS", [h("p", { style: { margin: 0 } }, d.sondages.length + " sondage(s), " + d.sondages.reduce((a, s) => a + s.photos.length, 0) + " photo(s) : fichier de " + mo + " Mo."),
    h("p", { class: "doux", style: { margin: 0 } }, "Choisissez Mail (ou Outlook, Gmail) dans le menu de partage, puis envoyez-le à votre adresse. Dans HORUS : ouvrez le dossier, « Importer… » et choisissez ce fichier (.txt). Les sondages sont créés ou complétés par leur nom."),
    taille > 18 * 1048576 ? h("div", { class: "alerte" }, "Fichier volumineux : envoyez en deux fois (moins de photos par envoi).") : null],
  fermer => [h("button", { onclick: async () => { telecharger(fichier); await fini(fermer); toast("Fichier enregistré dans Téléchargements : " + nom, 5000); } }, "Enregistrer le fichier"),
    h("button", { class: "prim", onclick: () => envoyer(fermer) }, "Partager…")]);
}

  await ouvrirBase();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { /* facultatif */ }
